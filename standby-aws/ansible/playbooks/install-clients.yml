---
- name: Install Standby EL and BN with VC sealed
  hosts: aws_standby
  become: true
  vars_files:
    - ../../configs/client-release-lock.generated.json
  vars:
    nethermind_version: "{{ client_release_lock.nethermind.version }}"
    nethermind_sha256: "{{ client_release_lock.nethermind.sha256 }}"
    nethermind_archive_url: "{{ client_release_lock.nethermind.archive_url }}"
    nethermind_signature_url: "{{ client_release_lock.nethermind.signature_url }}"
    nethermind_signature_sha256: "{{ client_release_lock.nethermind.signature_sha256 }}"
    nethermind_signer_fingerprint: "{{ client_release_lock.nethermind.signer_fingerprint }}"
    lighthouse_version: "{{ client_release_lock.lighthouse.version }}"
    lighthouse_sha256: "{{ client_release_lock.lighthouse.sha256 }}"
    lighthouse_archive_url: "{{ client_release_lock.lighthouse.archive_url }}"
    lighthouse_signature_url: "{{ client_release_lock.lighthouse.signature_url }}"
    lighthouse_signature_sha256: "{{ client_release_lock.lighthouse.signature_sha256 }}"
    lighthouse_signer_fingerprint: "{{ client_release_lock.lighthouse.signer_fingerprint }}"
  roles:
    - nethermind
    - lighthouse_bn
    - vc_sealed

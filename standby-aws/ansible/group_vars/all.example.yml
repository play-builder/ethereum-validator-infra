enable_mev_boost: false
mev_boost_version: "1.12"
mev_boost_sha256: "51e24be111c230526f39f4f278fe1b2319a7d81de36fcc3f4a441cd81b8687eb"
mev_relays: []
admin_ipv4_cidrs: ["203.0.113.10/32"]
aws_region: "eu-central-1"
sns_topic_arn: "REPLACE_WITH_PRIMARY_SNS_TOPIC_ARN"

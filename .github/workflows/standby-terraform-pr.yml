name: Standby Terraform PR validation

on:
  pull_request:
    paths:
      - "standby-aws/terraform/**"
      - ".github/workflows/standby-terraform-*.yml"
  push:
    branches: [main]
    paths:
      - "standby-aws/terraform/**"

permissions:
  contents: read

jobs:
  standby-terraform-static:
    name: standby-terraform-static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - name: Validate Standby Terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=standby-aws/terraform fmt -check -recursive
          terraform -chdir=standby-aws/terraform init -backend=false -lockfile=readonly
          terraform -chdir=standby-aws/terraform validate
          python3 standby-aws/terraform/tests/test_standby_contract.py

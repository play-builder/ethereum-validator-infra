---
- name: daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
- name: restart prometheus
  ansible.builtin.systemd:
    name: prometheus.service
    state: restarted
    daemon_reload: true
- name: restart alertmanager
  ansible.builtin.systemd:
    name: alertmanager.service
    state: restarted
    daemon_reload: true
- name: restart grafana
  ansible.builtin.systemd:
    name: grafana.service
    state: restarted
    daemon_reload: true

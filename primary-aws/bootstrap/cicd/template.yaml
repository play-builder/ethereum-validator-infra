{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "One-time GitHub OIDC, Terraform CI roles, state/artifact storage, imported node SSH public key, and node permissions boundary for hoodi-testnet-dev.",
  "Parameters": {
    "GitHubRepository": {
      "Type": "String",
      "Description": "Exact GitHub repository in OWNER/REPOSITORY form.",
      "AllowedPattern": "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$",
      "ConstraintDescription": "must be an exact OWNER/REPOSITORY value"
    },
    "GitHubRepositoryOwnerId": {
      "Type": "String",
      "Description": "Immutable numeric GitHub owner ID returned by the repositories API.",
      "AllowedPattern": "^[0-9]+$",
      "ConstraintDescription": "must be the numeric owner ID for GitHubRepository"
    },
    "GitHubRepositoryId": {
      "Type": "String",
      "Description": "Immutable numeric GitHub repository ID returned by the repositories API.",
      "AllowedPattern": "^[0-9]+$",
      "ConstraintDescription": "must be the numeric repository ID for GitHubRepository"
    },
    "GitHubEnvironment": {
      "Type": "String",
      "Default": "hoodi-testnet-dev",
      "AllowedValues": [
        "hoodi-testnet-dev"
      ],
      "Description": "Exact protected GitHub Environment allowed to assume the apply role."
    },
    "GitHubTeardownEnvironment": {
      "Type": "String",
      "Default": "hoodi-testnet-dev-teardown",
      "AllowedValues": [
        "hoodi-testnet-dev-teardown"
      ],
      "Description": "Exact separately protected GitHub Environment allowed to assume the same apply role for approved teardown."
    },
    "ExistingGithubOidcProviderArn": {
      "Type": "String",
      "Default": "",
      "Description": "Optional ARN of an existing token.actions.githubusercontent.com provider. Blank creates this stack's provider."
    },
    "TerraformPlanRoleName": {
      "Type": "String",
      "Default": "hoodi-testnet-dev-TerraformPlanRole",
      "AllowedPattern": "^[A-Za-z0-9+=,.@_-]{1,64}$"
    },
    "TerraformApplyRoleName": {
      "Type": "String",
      "Default": "hoodi-testnet-dev-TerraformApplyRole",
      "AllowedPattern": "^[A-Za-z0-9+=,.@_-]{1,64}$"
    },
    "NodeRoleName": {
      "Type": "String",
      "Default": "eth-failover-hoodi-node",
      "AllowedPattern": "^[A-Za-z0-9+=,.@_-]{1,64}$"
    },
    "NodeInstanceProfileName": {
      "Type": "String",
      "Default": "eth-failover-hoodi-node",
      "AllowedPattern": "^[A-Za-z0-9+=,.@_-]{1,128}$"
    },
    "NodeSshKeyPairName": {
      "Type": "String",
      "Default": "eth-failover-hoodi",
      "AllowedValues": [
        "eth-failover-hoodi"
      ],
      "Description": "Exact EC2 key-pair name imported once by this bootstrap stack."
    },
    "NodeSshPublicKey": {
      "Type": "String",
      "AllowedPattern": "^ssh-ed25519 [A-Za-z0-9+/]{68}( [^\\r\\n]{1,255})?$",
      "ConstraintDescription": "must be one complete single-line OpenSSH ssh-ed25519 public key; private key material and multiline input are forbidden"
    },
    "NodePermissionsBoundaryName": {
      "Type": "String",
      "Default": "hoodi-testnet-dev-node-permissions-boundary",
      "AllowedPattern": "^[A-Za-z0-9+=,.@_-]{1,128}$"
    },
    "StateBucketMode": {
      "Type": "String",
      "Default": "CREATE",
      "AllowedValues": [
        "CREATE",
        "EXISTING"
      ],
      "Description": "CREATE creates a new state bucket. EXISTING only references a separately verified bucket; it never imports or mutates it."
    },
    "StateBucketName": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$",
      "ConstraintDescription": "must be blank in EXISTING mode or a globally unique, DNS-compatible S3 bucket name in CREATE mode"
    },
    "ExistingStateBucketName": {
      "Type": "String",
      "Default": "",
      "Description": "Required only in EXISTING mode. The stack does not import, update, or attach a policy to this bucket."
    },
    "ExistingStateKmsKeyArn": {
      "Type": "String",
      "Default": "",
      "Description": "Required only in EXISTING mode; CMK ARN already protecting the existing state bucket."
    },
    "StateKey": {
      "Type": "String",
      "Default": "hoodi-testnet-dev/terraform.tfstate",
      "AllowedPattern": "^[A-Za-z0-9!_.*'()/=-]+(?:/[A-Za-z0-9!_.*'()/=-]+)*$"
    },
    "PlanArtifactBucketName": {
      "Type": "String",
      "AllowedPattern": "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$",
      "ConstraintDescription": "must be a globally unique, DNS-compatible S3 bucket name"
    },
    "CloudTrailTrailArn": {
      "Type": "String",
      "Default": "",
      "Description": "Optional existing regional CloudTrail ARN. When supplied, the plan bucket permits this trail's standard S3 delivery path."
    }
  },
  "Rules": {
    "ExistingStateBucketRequiresInputs": {
      "RuleCondition": {
        "Fn::Equals": [
          {
            "Ref": "StateBucketMode"
          },
          "EXISTING"
        ]
      },
      "Assertions": [
        {
          "Assert": {
            "Fn::Not": [
              {
                "Fn::Equals": [
                  {
                    "Ref": "ExistingStateBucketName"
                  },
                  ""
                ]
              }
            ]
          },
          "AssertDescription": "EXISTING StateBucketMode requires ExistingStateBucketName."
        },
        {
          "Assert": {
            "Fn::Not": [
              {
                "Fn::Equals": [
                  {
                    "Ref": "ExistingStateKmsKeyArn"
                  },
                  ""
                ]
              }
            ]
          },
          "AssertDescription": "EXISTING StateBucketMode requires ExistingStateKmsKeyArn."
        },
        {
          "Assert": {
            "Fn::Equals": [
              {
                "Ref": "StateBucketName"
              },
              ""
            ]
          },
          "AssertDescription": "EXISTING StateBucketMode must leave CREATE-only StateBucketName blank."
        }
      ]
    },
    "CreateStateBucketForbidsExistingInputs": {
      "RuleCondition": {
        "Fn::Equals": [
          {
            "Ref": "StateBucketMode"
          },
          "CREATE"
        ]
      },
      "Assertions": [
        {
          "Assert": {
            "Fn::Equals": [
              {
                "Ref": "ExistingStateBucketName"
              },
              ""
            ]
          },
          "AssertDescription": "CREATE StateBucketMode must not be combined with ExistingStateBucketName."
        },
        {
          "Assert": {
            "Fn::Equals": [
              {
                "Ref": "ExistingStateKmsKeyArn"
              },
              ""
            ]
          },
          "AssertDescription": "CREATE StateBucketMode must not be combined with ExistingStateKmsKeyArn."
        }
      ]
    },
    "CreateStateBucketRequiresName": {
      "RuleCondition": {
        "Fn::Equals": [
          {
            "Ref": "StateBucketMode"
          },
          "CREATE"
        ]
      },
      "Assertions": [
        {
          "Assert": {
            "Fn::Not": [
              {
                "Fn::Equals": [
                  {
                    "Ref": "StateBucketName"
                  },
                  ""
                ]
              }
            ]
          },
          "AssertDescription": "CREATE StateBucketMode requires StateBucketName."
        }
      ]
    }
  },
  "Conditions": {
    "CreateGithubOidcProvider": {
      "Fn::Equals": [
        {
          "Ref": "ExistingGithubOidcProviderArn"
        },
        ""
      ]
    },
    "CreateStateBucket": {
      "Fn::Equals": [
        {
          "Ref": "StateBucketMode"
        },
        "CREATE"
      ]
    },
    "ConfigureCloudTrailDelivery": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "CloudTrailTrailArn"
            },
            ""
          ]
        }
      ]
    }
  },
  "Resources": {
    "GithubOidcProvider": {
      "Type": "AWS::IAM::OIDCProvider",
      "Condition": "CreateGithubOidcProvider",
      "Properties": {
        "Url": "https://token.actions.githubusercontent.com",
        "ClientIdList": [
          "sts.amazonaws.com"
        ],
        "Tags": [
          {
            "Key": "ManagedBy",
            "Value": "CloudFormation"
          },
          {
            "Key": "Purpose",
            "Value": "terraform-cicd"
          }
        ]
      }
    },
    "StateKmsKey": {
      "Type": "AWS::KMS::Key",
      "Condition": "CreateStateBucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Description": "SSE-KMS key for Terraform state in hoodi-testnet-dev",
        "EnableKeyRotation": true,
        "KeyPolicy": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "EnableAccountRootToDelegateAccess",
              "Effect": "Allow",
              "Principal": {
                "AWS": {
                  "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
                }
              },
              "Action": "kms:*",
              "Resource": "*"
            }
          ]
        }
      }
    },
    "PlanArtifactKmsKey": {
      "Type": "AWS::KMS::Key",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Description": "SSE-KMS key for Terraform saved-plan artifacts in hoodi-testnet-dev",
        "EnableKeyRotation": true,
        "KeyPolicy": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "EnableAccountRootToDelegateAccess",
              "Effect": "Allow",
              "Principal": {
                "AWS": {
                  "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
                }
              },
              "Action": "kms:*",
              "Resource": "*"
            },
            {
              "Fn::If": [
                "ConfigureCloudTrailDelivery",
                {
                  "Sid": "AllowCloudTrailEncryptAndDescribe",
                  "Effect": "Allow",
                  "Principal": {
                    "Service": "cloudtrail.amazonaws.com"
                  },
                  "Action": [
                    "kms:GenerateDataKey*",
                    "kms:DescribeKey"
                  ],
                  "Resource": "*",
                  "Condition": {
                    "StringEquals": {
                      "aws:SourceArn": {
                        "Ref": "CloudTrailTrailArn"
                      }
                    },
                    "StringLike": {
                      "kms:EncryptionContext:aws:cloudtrail:arn": {
                        "Fn::Sub": "arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:trail/*"
                      }
                    }
                  }
                },
                {
                  "Ref": "AWS::NoValue"
                }
              ]
            }
          ]
        }
      }
    },
    "StateBucket": {
      "Type": "AWS::S3::Bucket",
      "Condition": "CreateStateBucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BucketName": {
          "Ref": "StateBucketName"
        },
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "aws:kms",
                "KMSMasterKeyID": {
                  "Fn::GetAtt": [
                    "StateKmsKey",
                    "Arn"
                  ]
                }
              },
              "BucketKeyEnabled": true
            }
          ]
        },
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        },
        "VersioningConfiguration": {
          "Status": "Enabled"
        },
        "Tags": [
          {
            "Key": "ManagedBy",
            "Value": "CloudFormation"
          },
          {
            "Key": "Purpose",
            "Value": "terraform-state"
          }
        ]
      }
    },
    "PlanArtifactBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BucketName": {
          "Ref": "PlanArtifactBucketName"
        },
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "aws:kms",
                "KMSMasterKeyID": {
                  "Fn::GetAtt": [
                    "PlanArtifactKmsKey",
                    "Arn"
                  ]
                }
              },
              "BucketKeyEnabled": true
            }
          ]
        },
        "LifecycleConfiguration": {
          "Rules": [
            {
              "Id": "ExpireSavedPlanArtifactsAfterOneDay",
              "Status": "Enabled",
              "ExpirationInDays": 1,
              "NoncurrentVersionExpiration": {
                "NoncurrentDays": 1
              }
            }
          ]
        },
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        },
        "VersioningConfiguration": {
          "Status": "Enabled"
        },
        "Tags": [
          {
            "Key": "ManagedBy",
            "Value": "CloudFormation"
          },
          {
            "Key": "Purpose",
            "Value": "terraform-saved-plan-artifacts"
          }
        ]
      }
    },
    "NodeSshKeyPair": {
      "Type": "AWS::EC2::KeyPair",
      "Properties": {
        "KeyName": {
          "Ref": "NodeSshKeyPairName"
        },
        "KeyType": "ed25519",
        "PublicKeyMaterial": {
          "Ref": "NodeSshPublicKey"
        },
        "Tags": [
          {
            "Key": "Project",
            "Value": "eth-failover"
          },
          {
            "Key": "Network",
            "Value": "hoodi"
          },
          {
            "Key": "Managed",
            "Value": "cloudformation"
          }
        ]
      }
    },
    "NodePermissionsBoundary": {
      "Type": "AWS::IAM::ManagedPolicy",
      "Properties": {
        "ManagedPolicyName": {
          "Ref": "NodePermissionsBoundaryName"
        },
        "Description": "Permissions boundary required on the Terraform-managed EC2 node role.",
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "PublishOnlyHoodiHeartbeat",
              "Effect": "Allow",
              "Action": "cloudwatch:PutMetricData",
              "Resource": "*",
              "Condition": {
                "StringEquals": {
                  "cloudwatch:namespace": "EthFailover/hoodi"
                }
              }
            },
            {
              "Sid": "DecryptOnlyPrimaryHoodiKeystoreKeys",
              "Effect": "Allow",
              "Action": "kms:Decrypt",
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              },
              "Condition": {
                "StringEquals": {
                  "aws:ResourceTag/Project": "eth-failover",
                  "aws:ResourceTag/Network": "hoodi"
                }
              }
            },
            {
              "Sid": "PublishOnlyHoodiAlerts",
              "Effect": "Allow",
              "Action": "sns:Publish",
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:eth-failover-hoodi-alerts"
              }
            },
            {
              "Sid": "ReadOnlyHoodiParameters",
              "Effect": "Allow",
              "Action": [
                "ssm:GetParameter",
                "ssm:GetParameters",
                "ssm:GetParametersByPath"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/eth-staking/hoodi/*"
              }
            },
            {
              "Sid": "ReadOnlyHoodiStagingObjects",
              "Effect": "Allow",
              "Action": "s3:GetObject",
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:s3:::eth-failover-hoodi-staging-${AWS::AccountId}/staged/*"
              }
            }
          ]
        }
      }
    },
    "KmsBreakGlassRole": {
      "Type": "AWS::IAM::Role",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "RoleName": "hoodi-testnet-dev-KmsBreakGlassRole",
        "Description": "Dormant KMS policy recovery role; assumed only by the temporary terraform_cicd_bootstrap_admin Identity Center role.",
        "MaxSessionDuration": 3600,
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowOnlyTerraformCicdBootstrapAdminPermissionSet",
              "Effect": "Allow",
              "Principal": {
                "AWS": {
                  "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
                }
              },
              "Action": "sts:AssumeRole",
              "Condition": {
                "ArnLike": {
                  "aws:PrincipalArn": {
                    "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_terraform_cicd_bootstrap_admin_*"
                  }
                }
              }
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "recover-only-tagged-terraform-kms-keys",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "RecoverOnlyTaggedTerraformKmsKeys",
                  "Effect": "Allow",
                  "Action": [
                    "kms:CancelKeyDeletion",
                    "kms:DescribeKey",
                    "kms:DisableKey",
                    "kms:DisableKeyRotation",
                    "kms:EnableKey",
                    "kms:EnableKeyRotation",
                    "kms:GetKeyPolicy",
                    "kms:GetKeyRotationStatus",
                    "kms:PutKeyPolicy",
                    "kms:ScheduleKeyDeletion",
                    "kms:TagResource",
                    "kms:UntagResource",
                    "kms:UpdateKeyDescription"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:kms:*:${AWS::AccountId}:key/*"
                  },
                  "Condition": {
                    "StringEquals": {
                      "aws:ResourceTag/Project": "eth-failover",
                      "aws:ResourceTag/Network": "hoodi",
                      "aws:ResourceTag/Role": "primary",
                      "aws:ResourceTag/Managed": "terraform"
                    }
                  }
                }
              ]
            }
          }
        ],
        "Tags": [
          {
            "Key": "ManagedBy",
            "Value": "CloudFormation"
          },
          {
            "Key": "Purpose",
            "Value": "kms-break-glass"
          }
        ]
      }
    },
    "TerraformPlanRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": {
          "Ref": "TerraformPlanRoleName"
        },
        "MaxSessionDuration": 3600,
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowOnlyExactMainBranchFromRepository",
              "Effect": "Allow",
              "Principal": {
                "Federated": {
                  "Fn::If": [
                    "CreateGithubOidcProvider",
                    {
                      "Fn::GetAtt": [
                        "GithubOidcProvider",
                        "Arn"
                      ]
                    },
                    {
                      "Ref": "ExistingGithubOidcProviderArn"
                    }
                  ]
                }
              },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
                  "token.actions.githubusercontent.com:sub": {
                    "Fn::Sub": [
                      "repo:${RepositoryOwner}@${GitHubRepositoryOwnerId}/${RepositoryName}@${GitHubRepositoryId}:ref:refs/heads/main",
                      {
                        "RepositoryOwner": {
                          "Fn::Select": [
                            0,
                            {
                              "Fn::Split": [
                                "/",
                                {
                                  "Ref": "GitHubRepository"
                                }
                              ]
                            }
                          ]
                        },
                        "RepositoryName": {
                          "Fn::Select": [
                            1,
                            {
                              "Fn::Split": [
                                "/",
                                {
                                  "Ref": "GitHubRepository"
                                }
                              ]
                            }
                          ]
                        }
                      }
                    ]
                  }
                }
              }
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "terraform-plan-state-artifact-and-readonly",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "ReadOnlyState",
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject",
                    "s3:GetObjectVersion"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": [
                        "${StateBucketArn}/hoodi-testnet-dev/terraform.tfstate",
                        {
                          "StateBucketArn": {
                            "Fn::If": [
                              "CreateStateBucket",
                              {
                                "Fn::GetAtt": [
                                  "StateBucket",
                                  "Arn"
                                ]
                              },
                              {
                                "Fn::Sub": "arn:${AWS::Partition}:s3:::${ExistingStateBucketName}"
                              }
                            ]
                          }
                        }
                      ]
                    },
                    {
                      "Fn::Sub": [
                        "${StateBucketArn}/hoodi-testnet-dev/standby-terraform.tfstate",
                        {
                          "StateBucketArn": {
                            "Fn::If": [
                              "CreateStateBucket",
                              {
                                "Fn::GetAtt": [
                                  "StateBucket",
                                  "Arn"
                                ]
                              },
                              {
                                "Fn::Sub": "arn:${AWS::Partition}:s3:::${ExistingStateBucketName}"
                              }
                            ]
                          }
                        }
                      ]
                    }
                  ]
                },
                {
                  "Sid": "ManageOnlyStateLock",
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject",
                    "s3:PutObject",
                    "s3:DeleteObject"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": [
                        "${StateBucketArn}/hoodi-testnet-dev/terraform.tfstate.tflock",
                        {
                          "StateBucketArn": {
                            "Fn::If": [
                              "CreateStateBucket",
                              {
                                "Fn::GetAtt": [
                                  "StateBucket",
                                  "Arn"
                                ]
                              },
                              {
                                "Fn::Sub": "arn:${AWS::Partition}:s3:::${ExistingStateBucketName}"
                              }
                            ]
                          }
                        }
                      ]
                    },
                    {
                      "Fn::Sub": [
                        "${StateBucketArn}/hoodi-testnet-dev/standby-terraform.tfstate.tflock",
                        {
                          "StateBucketArn": {
                            "Fn::If": [
                              "CreateStateBucket",
                              {
                                "Fn::GetAtt": [
                                  "StateBucket",
                                  "Arn"
                                ]
                              },
                              {
                                "Fn::Sub": "arn:${AWS::Partition}:s3:::${ExistingStateBucketName}"
                              }
                            ]
                          }
                        }
                      ]
                    }
                  ]
                },
                {
                  "Sid": "ListOnlyStateBucket",
                  "Effect": "Allow",
                  "Action": "s3:ListBucket",
                  "Resource": {
                    "Fn::If": [
                      "CreateStateBucket",
                      {
                        "Fn::GetAtt": [
                          "StateBucket",
                          "Arn"
                        ]
                      },
                      {
                        "Fn::Sub": "arn:${AWS::Partition}:s3:::${ExistingStateBucketName}"
                      }
                    ]
                  },
                  "Condition": {
                    "StringEquals": {
                      "s3:prefix": [
                        "hoodi-testnet-dev/terraform.tfstate",
                        "hoodi-testnet-dev/standby-terraform.tfstate",
                        "hoodi-testnet-dev/terraform.tfstate.tflock",
                        "hoodi-testnet-dev/standby-terraform.tfstate.tflock"
                      ]
                    }
                  }
                },
                {
                  "Sid": "UseStateAndPlanKeys",
                  "Effect": "Allow",
                  "Action": [
                    "kms:Decrypt",
                    "kms:DescribeKey",
                    "kms:Encrypt",
                    "kms:GenerateDataKey"
                  ],
                  "Resource": [
                    {
                      "Fn::If": [
                        "CreateStateBucket",
                        {
                          "Fn::GetAtt": [
                            "StateKmsKey",
                            "Arn"
                          ]
                        },
                        {
                          "Ref": "ExistingStateKmsKeyArn"
                        }
                      ]
                    },
                    {
                      "Fn::GetAtt": [
                        "PlanArtifactKmsKey",
                        "Arn"
                      ]
                    }
                  ]
                },
                {
                  "Sid": "CreateOnlyPlanArtifactObjects",
                  "Effect": "Allow",
                  "Action": "s3:PutObject",
                  "Resource": {
                    "Fn::Sub": "${PlanArtifactBucket.Arn}/${GitHubRepository}/*"
                  },
                  "Condition": {
                    "StringEquals": {
                      "s3:if-none-match": "*",
                      "s3:x-amz-server-side-encryption": "aws:kms",
                      "s3:x-amz-server-side-encryption-aws-kms-key-id": {
                        "Fn::GetAtt": [
                          "PlanArtifactKmsKey",
                          "Arn"
                        ]
                      }
                    }
                  }
                },
                {
                  "Sid": "ReadTerraformProviderGraph",
                  "Effect": "Allow",
                  "Action": [
                    "cloudwatch:DescribeAlarms",
                    "cloudwatch:ListTagsForResource",
                    "ec2:Describe*",
                    "iam:GetInstanceProfile",
                    "iam:GetRole",
                    "iam:GetRolePolicy",
                    "iam:ListAttachedRolePolicies",
                    "iam:ListInstanceProfilesForRole",
                    "iam:ListRolePolicies",
                    "kms:DescribeKey",
                    "kms:GetKeyPolicy",
                    "kms:GetKeyRotationStatus",
                    "kms:ListAliases",
                    "kms:ListResourceTags",
                    "sns:GetSubscriptionAttributes",
                    "sns:GetTopicAttributes",
                    "sns:ListSubscriptionsByTopic",
                    "sns:ListTagsForResource",
                    "ssm:GetParameter",
                    "ssm:ListTagsForResource",
                    "sts:GetCallerIdentity"
                  ],
                  "Resource": "*"
                },
                {
                  "Sid": "ReadOnlyTerraformStagingBucket",
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetAccelerateConfiguration",
                    "s3:GetBucketAcl",
                    "s3:GetBucketCORS",
                    "s3:GetBucketLocation",
                    "s3:GetBucketLogging",
                    "s3:GetBucketObjectLockConfiguration",
                    "s3:GetBucketPolicy",
                    "s3:GetBucketPublicAccessBlock",
                    "s3:GetBucketRequestPayment",
                    "s3:GetBucketTagging",
                    "s3:GetBucketVersioning",
                    "s3:GetBucketWebsite",
                    "s3:GetEncryptionConfiguration",
                    "s3:GetLifecycleConfiguration",
                    "s3:GetReplicationConfiguration",
                    "s3:ListBucket"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:s3:::eth-failover-hoodi-staging-${AWS::AccountId}"
                  }
                }
              ]
            }
          }
        ],
        "Tags": [
          {
            "Key": "ManagedBy",
            "Value": "CloudFormation"
          },
          {
            "Key": "Purpose",
            "Value": "terraform-plan"
          }
        ]
      }
    },
    "TerraformApplyRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": {
          "Ref": "TerraformApplyRoleName"
        },
        "MaxSessionDuration": 3600,
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowOnlyExactProtectedEnvironmentFromRepository",
              "Effect": "Allow",
              "Principal": {
                "Federated": {
                  "Fn::If": [
                    "CreateGithubOidcProvider",
                    {
                      "Fn::GetAtt": [
                        "GithubOidcProvider",
                        "Arn"
                      ]
                    },
                    {
                      "Ref": "ExistingGithubOidcProviderArn"
                    }
                  ]
                }
              },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
                  "token.actions.githubusercontent.com:sub": [
                    {
                      "Fn::Sub": [
                        "repo:${RepositoryOwner}@${GitHubRepositoryOwnerId}/${RepositoryName}@${GitHubRepositoryId}:environment:${GitHubEnvironment}",
                        {
                          "RepositoryOwner": {
                            "Fn::Select": [
                              0,
                              {
                                "Fn::Split": [
                                  "/",
                                  {
                                    "Ref": "GitHubRepository"
                                  }
                                ]
                              }
                            ]
                          },
                          "RepositoryName": {
                            "Fn::Select": [
                              1,
                              {
                                "Fn::Split": [
                                  "/",
                                  {
                                    "Ref": "GitHubRepository"
                                  }
                                ]
                              }
                            ]
                          }
                        }
                      ]
                    },
                    {
                      "Fn::Sub": [
                        "repo:${RepositoryOwner}@${GitHubRepositoryOwnerId}/${RepositoryName}@${GitHubRepositoryId}:environment:${GitHubTeardownEnvironment}",
                        {
                          "RepositoryOwner": {
                            "Fn::Select": [
                              0,
                              {
                                "Fn::Split": [
                                  "/",
                                  {
                                    "Ref": "GitHubRepository"
                                  }
                                ]
                              }
                            ]
                          },
                          "RepositoryName": {
                            "Fn::Select": [
                              1,
                              {
                                "Fn::Split": [
                                  "/",
                                  {
                                    "Ref": "GitHubRepository"
                                  }
                                ]
                              }
                            ]
                          }
                        }
                      ]
                    }
                  ]
                }
              }
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "terraform-apply-workload-with-boundary",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "ReadAndWriteOnlyStateAndLock",
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject",
                    "s3:GetObjectVersion",
                    "s3:PutObject",
                    "s3:DeleteObject"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": [
                        "${StateBucketArn}/hoodi-testnet-dev/terraform.tfstate",
                        {
                          "StateBucketArn": {
                            "Fn::If": [
                              "CreateStateBucket",
                              {
                                "Fn::GetAtt": [
                                  "StateBucket",
                                  "Arn"
                                ]
                              },
                              {
                                "Fn::Sub": "arn:${AWS::Partition}:s3:::${ExistingStateBucketName}"
                              }
                            ]
                          }
                        }
                      ]
                    },
                    {
                      "Fn::Sub": [
                        "${StateBucketArn}/hoodi-testnet-dev/standby-terraform.tfstate",
                        {
                          "StateBucketArn": {
                            "Fn::If": [
                              "CreateStateBucket",
                              {
                                "Fn::GetAtt": [
                                  "StateBucket",
                                  "Arn"
                                ]
                              },
                              {
                                "Fn::Sub": "arn:${AWS::Partition}:s3:::${ExistingStateBucketName}"
                              }
                            ]
                          }
                        }
                      ]
                    },
                    {
                      "Fn::Sub": [
                        "${StateBucketArn}/hoodi-testnet-dev/terraform.tfstate.tflock",
                        {
                          "StateBucketArn": {
                            "Fn::If": [
                              "CreateStateBucket",
                              {
                                "Fn::GetAtt": [
                                  "StateBucket",
                                  "Arn"
                                ]
                              },
                              {
                                "Fn::Sub": "arn:${AWS::Partition}:s3:::${ExistingStateBucketName}"
                              }
                            ]
                          }
                        }
                      ]
                    },
                    {
                      "Fn::Sub": [
                        "${StateBucketArn}/hoodi-testnet-dev/standby-terraform.tfstate.tflock",
                        {
                          "StateBucketArn": {
                            "Fn::If": [
                              "CreateStateBucket",
                              {
                                "Fn::GetAtt": [
                                  "StateBucket",
                                  "Arn"
                                ]
                              },
                              {
                                "Fn::Sub": "arn:${AWS::Partition}:s3:::${ExistingStateBucketName}"
                              }
                            ]
                          }
                        }
                      ]
                    }
                  ]
                },
                {
                  "Sid": "ListOnlyStateBucket",
                  "Effect": "Allow",
                  "Action": "s3:ListBucket",
                  "Resource": {
                    "Fn::If": [
                      "CreateStateBucket",
                      {
                        "Fn::GetAtt": [
                          "StateBucket",
                          "Arn"
                        ]
                      },
                      {
                        "Fn::Sub": "arn:${AWS::Partition}:s3:::${ExistingStateBucketName}"
                      }
                    ]
                  },
                  "Condition": {
                    "StringEquals": {
                      "s3:prefix": [
                        "hoodi-testnet-dev/terraform.tfstate",
                        "hoodi-testnet-dev/standby-terraform.tfstate",
                        "hoodi-testnet-dev/terraform.tfstate.tflock",
                        "hoodi-testnet-dev/standby-terraform.tfstate.tflock"
                      ]
                    }
                  }
                },
                {
                  "Sid": "ReadExactVersionedPlanArtifacts",
                  "Effect": "Allow",
                  "Action": "s3:GetObjectVersion",
                  "Resource": {
                    "Fn::Sub": "${PlanArtifactBucket.Arn}/${GitHubRepository}/*"
                  }
                },
                {
                  "Sid": "UseStateAndArtifactKeys",
                  "Effect": "Allow",
                  "Action": [
                    "kms:Decrypt",
                    "kms:DescribeKey",
                    "kms:Encrypt",
                    "kms:GenerateDataKey"
                  ],
                  "Resource": [
                    {
                      "Fn::If": [
                        "CreateStateBucket",
                        {
                          "Fn::GetAtt": [
                            "StateKmsKey",
                            "Arn"
                          ]
                        },
                        {
                          "Ref": "ExistingStateKmsKeyArn"
                        }
                      ]
                    },
                    {
                      "Fn::GetAtt": [
                        "PlanArtifactKmsKey",
                        "Arn"
                      ]
                    }
                  ]
                },
                {
                  "Sid": "CreateNodeRoleWithRequiredBoundary",
                  "Effect": "Allow",
                  "Action": "iam:CreateRole",
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${NodeRoleName}"
                  },
                  "Condition": {
                    "StringEquals": {
                      "iam:PermissionsBoundary": {
                        "Ref": "NodePermissionsBoundary"
                      }
                    }
                  }
                },
                {
                  "Sid": "ManageOnlyTerraformNodeRoleAndProfile",
                  "Effect": "Allow",
                  "Action": [
                    "iam:AddRoleToInstanceProfile",
                    "iam:CreateInstanceProfile",
                    "iam:DeleteInstanceProfile",
                    "iam:DeleteRole",
                    "iam:DeleteRolePolicy",
                    "iam:GetInstanceProfile",
                    "iam:GetRole",
                    "iam:GetRolePolicy",
                    "iam:ListAttachedRolePolicies",
                    "iam:ListInstanceProfilesForRole",
                    "iam:ListRolePolicies",
                    "iam:RemoveRoleFromInstanceProfile",
                    "iam:TagInstanceProfile",
                    "iam:TagRole",
                    "iam:UntagInstanceProfile",
                    "iam:UntagRole",
                    "iam:UpdateAssumeRolePolicy",
                    "iam:UpdateRole",
                    "iam:UpdateRoleDescription"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${NodeRoleName}"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/${NodeInstanceProfileName}"
                    }
                  ]
                },
                {
                  "Sid": "KeepExactNodePermissionsBoundary",
                  "Effect": "Allow",
                  "Action": "iam:PutRolePermissionsBoundary",
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${NodeRoleName}"
                  },
                  "Condition": {
                    "StringEquals": {
                      "iam:PermissionsBoundary": {
                        "Ref": "NodePermissionsBoundary"
                      }
                    }
                  }
                },
                {
                  "Sid": "PutOnlyNodeInlinePoliciesWithRequiredBoundary",
                  "Effect": "Allow",
                  "Action": "iam:PutRolePolicy",
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${NodeRoleName}"
                  },
                  "Condition": {
                    "StringEquals": {
                      "iam:PermissionsBoundary": {
                        "Ref": "NodePermissionsBoundary"
                      }
                    }
                  }
                },
                {
                  "Sid": "PassOnlyTheNodeRoleToEc2",
                  "Effect": "Allow",
                  "Action": "iam:PassRole",
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${NodeRoleName}"
                  },
                  "Condition": {
                    "StringEquals": {
                      "iam:PassedToService": "ec2.amazonaws.com"
                    }
                  }
                },
                {
                  "Sid": "ManageTerraformEc2Resources",
                  "Effect": "Allow",
                  "Action": "ec2:*",
                  "Resource": "*"
                },
                {
                  "Sid": "CreateOnlyTaggedTerraformKmsKeys",
                  "Effect": "Allow",
                  "Action": "kms:CreateKey",
                  "Resource": "*",
                  "Condition": {
                    "StringEquals": {
                      "aws:RequestTag/Project": "eth-failover",
                      "aws:RequestTag/Network": "hoodi",
                      "aws:RequestTag/Role": "primary",
                      "aws:RequestTag/Managed": "terraform",
                      "aws:RequestTag/Purpose": [
                        "primary-keystore-envelope",
                        "recovery-keystore-envelope"
                      ],
                      "kms:KeySpec": "SYMMETRIC_DEFAULT",
                      "kms:KeyUsage": "ENCRYPT_DECRYPT"
                    },
                    "Bool": {
                      "kms:BypassPolicyLockoutSafetyCheck": "false"
                    },
                    "ForAllValues:StringEquals": {
                      "aws:TagKeys": [
                        "Managed",
                        "Network",
                        "Project",
                        "Purpose",
                        "Role"
                      ]
                    }
                  }
                },
                {
                  "Sid": "TagOnlyNewTerraformKmsKeys",
                  "Effect": "Allow",
                  "Action": "kms:TagResource",
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:kms:*:${AWS::AccountId}:key/*"
                  },
                  "Condition": {
                    "StringEquals": {
                      "aws:RequestTag/Project": "eth-failover",
                      "aws:RequestTag/Network": "hoodi",
                      "aws:RequestTag/Role": "primary",
                      "aws:RequestTag/Managed": "terraform",
                      "aws:RequestTag/Purpose": [
                        "primary-keystore-envelope",
                        "recovery-keystore-envelope"
                      ],
                      "kms:CallerAccount": {
                        "Ref": "AWS::AccountId"
                      },
                      "kms:KeySpec": "SYMMETRIC_DEFAULT",
                      "kms:KeyUsage": "ENCRYPT_DECRYPT"
                    },
                    "ForAllValues:StringEquals": {
                      "aws:TagKeys": [
                        "Managed",
                        "Network",
                        "Project",
                        "Purpose",
                        "Role"
                      ]
                    }
                  }
                },
                {
                  "Sid": "ManageOnlyTaggedTerraformKmsKeys",
                  "Effect": "Allow",
                  "Action": [
                    "kms:CancelKeyDeletion",
                    "kms:DescribeKey",
                    "kms:DisableKey",
                    "kms:DisableKeyRotation",
                    "kms:EnableKey",
                    "kms:EnableKeyRotation",
                    "kms:GetKeyPolicy",
                    "kms:GetKeyRotationStatus",
                    "kms:ListResourceTags",
                    "kms:PutKeyPolicy",
                    "kms:ScheduleKeyDeletion",
                    "kms:UpdateKeyDescription"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:kms:*:${AWS::AccountId}:key/*"
                  },
                  "Condition": {
                    "StringEquals": {
                      "aws:ResourceTag/Project": "eth-failover",
                      "aws:ResourceTag/Network": "hoodi",
                      "aws:ResourceTag/Role": "primary",
                      "aws:ResourceTag/Managed": "terraform"
                    }
                  }
                },
                {
                  "Sid": "UseOnlyTaggedTerraformKmsAliasTargets",
                  "Effect": "Allow",
                  "Action": [
                    "kms:CreateAlias",
                    "kms:DeleteAlias",
                    "kms:UpdateAlias"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:kms:*:${AWS::AccountId}:key/*"
                  },
                  "Condition": {
                    "StringEquals": {
                      "aws:ResourceTag/Project": "eth-failover",
                      "aws:ResourceTag/Network": "hoodi",
                      "aws:ResourceTag/Role": "primary",
                      "aws:ResourceTag/Managed": "terraform"
                    }
                  }
                },
                {
                  "Sid": "ManageOnlyExactTerraformKmsAliases",
                  "Effect": "Allow",
                  "Action": [
                    "kms:CreateAlias",
                    "kms:DeleteAlias",
                    "kms:UpdateAlias"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:kms:*:${AWS::AccountId}:alias/eth-staking-hoodi-keystore"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:kms:*:${AWS::AccountId}:alias/eth-staking-hoodi-keystore-recovery"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:kms:*:${AWS::AccountId}:alias/eth-validator-keys-hoodi"
                    }
                  ]
                },
                {
                  "Sid": "ListKmsAliasesForProviderRefresh",
                  "Effect": "Allow",
                  "Action": "kms:ListAliases",
                  "Resource": "*"
                },
                {
                  "Sid": "ManageTerraformSnsResources",
                  "Effect": "Allow",
                  "Action": [
                    "sns:CreateTopic",
                    "sns:DeleteTopic",
                    "sns:GetSubscriptionAttributes",
                    "sns:GetTopicAttributes",
                    "sns:ListSubscriptionsByTopic",
                    "sns:ListTagsForResource",
                    "sns:SetSubscriptionAttributes",
                    "sns:SetTopicAttributes",
                    "sns:Subscribe",
                    "sns:TagResource",
                    "sns:Unsubscribe",
                    "sns:UntagResource"
                  ],
                  "Resource": "*"
                },
                {
                  "Sid": "ManageTerraformSsmParameters",
                  "Effect": "Allow",
                  "Action": [
                    "ssm:AddTagsToResource",
                    "ssm:DeleteParameter",
                    "ssm:GetParameter",
                    "ssm:ListTagsForResource",
                    "ssm:PutParameter",
                    "ssm:RemoveTagsFromResource"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/eth-staking/hoodi/*"
                  }
                },
                {
                  "Sid": "ManageTerraformCloudWatchAlarm",
                  "Effect": "Allow",
                  "Action": [
                    "cloudwatch:DeleteAlarms",
                    "cloudwatch:DescribeAlarms",
                    "cloudwatch:ListTagsForResource",
                    "cloudwatch:PutMetricAlarm",
                    "cloudwatch:TagResource",
                    "cloudwatch:UntagResource"
                  ],
                  "Resource": "*"
                },
                {
                  "Sid": "ManageTerraformStagingBucket",
                  "Effect": "Allow",
                  "Action": [
                    "s3:CreateBucket",
                    "s3:DeleteBucket",
                    "s3:DeleteBucketPolicy",
                    "s3:DeleteBucketEncryption",
                    "s3:DeletePublicAccessBlock",
                    "s3:GetAccelerateConfiguration",
                    "s3:GetBucketAcl",
                    "s3:GetBucketCORS",
                    "s3:GetBucketLocation",
                    "s3:GetBucketLogging",
                    "s3:GetBucketObjectLockConfiguration",
                    "s3:GetBucketPolicy",
                    "s3:GetBucketPublicAccessBlock",
                    "s3:GetBucketRequestPayment",
                    "s3:GetBucketTagging",
                    "s3:GetBucketVersioning",
                    "s3:GetBucketWebsite",
                    "s3:GetEncryptionConfiguration",
                    "s3:GetLifecycleConfiguration",
                    "s3:GetReplicationConfiguration",
                    "s3:ListBucket",
                    "s3:PutBucketPolicy",
                    "s3:PutBucketPublicAccessBlock",
                    "s3:PutBucketTagging",
                    "s3:PutBucketVersioning",
                    "s3:PutEncryptionConfiguration",
                    "s3:TagResource",
                    "s3:UntagResource"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:s3:::eth-failover-hoodi-staging-${AWS::AccountId}"
                  }
                },
                {
                  "Sid": "ListApprovedStagingObjectVersions",
                  "Effect": "Allow",
                  "Action": "s3:ListBucketVersions",
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:s3:::eth-failover-hoodi-staging-${AWS::AccountId}"
                  }
                },
                {
                  "Sid": "DeleteApprovedStagingObjectVersions",
                  "Effect": "Allow",
                  "Action": [
                    "s3:DeleteObject",
                    "s3:DeleteObjectVersion"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:s3:::eth-failover-hoodi-staging-${AWS::AccountId}/*"
                  }
                },
                {
                  "Sid": "ReadCallerIdentity",
                  "Effect": "Allow",
                  "Action": "sts:GetCallerIdentity",
                  "Resource": "*"
                },
                {
                  "Sid": "DenyBootstrapNodeSshKeyPairMutation",
                  "Effect": "Deny",
                  "Action": [
                    "ec2:CreateKeyPair",
                    "ec2:CreateTags",
                    "ec2:DeleteKeyPair",
                    "ec2:DeleteTags",
                    "ec2:ImportKeyPair"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:key-pair/${NodeSshKeyPairName}"
                  }
                },
                {
                  "Sid": "DenyNodeBoundaryRemoval",
                  "Effect": "Deny",
                  "Action": [
                    "iam:DeleteRolePermissionsBoundary"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${NodeRoleName}"
                  }
                },
                {
                  "Sid": "DenyAnyOidcProviderCreation",
                  "Effect": "Deny",
                  "Action": "iam:CreateOpenIDConnectProvider",
                  "Resource": "*"
                },
                {
                  "Sid": "DenyCiSelfManagement",
                  "Effect": "Deny",
                  "Action": [
                    "iam:AddClientIDToOpenIDConnectProvider",
                    "iam:DeleteOpenIDConnectProvider",
                    "iam:RemoveClientIDFromOpenIDConnectProvider",
                    "iam:UpdateOpenIDConnectProviderThumbprint",
                    "iam:UpdateRole",
                    "iam:UpdateRoleDescription"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${TerraformPlanRoleName}"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${TerraformApplyRoleName}"
                    },
                    {
                      "Fn::GetAtt": [
                        "KmsBreakGlassRole",
                        "Arn"
                      ]
                    },
                    {
                      "Fn::If": [
                        "CreateGithubOidcProvider",
                        {
                          "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
                        },
                        {
                          "Ref": "ExistingGithubOidcProviderArn"
                        }
                      ]
                    }
                  ]
                },
                {
                  "Sid": "DenyChangesToCiRolesAndBootstrapDataStores",
                  "Effect": "Deny",
                  "Action": [
                    "iam:DeleteRole",
                    "iam:DeleteRolePolicy",
                    "iam:PutRolePolicy",
                    "iam:UpdateAssumeRolePolicy",
                    "kms:DisableKey",
                    "kms:DisableKeyRotation",
                    "kms:EnableKey",
                    "kms:EnableKeyRotation",
                    "kms:PutKeyPolicy",
                    "kms:ScheduleKeyDeletion",
                    "kms:TagResource",
                    "kms:UntagResource",
                    "kms:UpdateKeyDescription",
                    "s3:DeleteBucket",
                    "s3:DeleteBucketPolicy",
                    "s3:PutBucketPolicy",
                    "s3:PutBucketPublicAccessBlock",
                    "s3:PutEncryptionConfiguration",
                    "s3:PutLifecycleConfiguration"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${TerraformPlanRoleName}"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${TerraformApplyRoleName}"
                    },
                    {
                      "Fn::GetAtt": [
                        "KmsBreakGlassRole",
                        "Arn"
                      ]
                    },
                    {
                      "Fn::If": [
                        "CreateStateBucket",
                        {
                          "Fn::GetAtt": [
                            "StateBucket",
                            "Arn"
                          ]
                        },
                        {
                          "Fn::Sub": "arn:${AWS::Partition}:s3:::${ExistingStateBucketName}"
                        }
                      ]
                    },
                    {
                      "Fn::GetAtt": [
                        "PlanArtifactBucket",
                        "Arn"
                      ]
                    },
                    {
                      "Fn::If": [
                        "CreateStateBucket",
                        {
                          "Fn::GetAtt": [
                            "StateKmsKey",
                            "Arn"
                          ]
                        },
                        {
                          "Ref": "ExistingStateKmsKeyArn"
                        }
                      ]
                    },
                    {
                      "Fn::GetAtt": [
                        "PlanArtifactKmsKey",
                        "Arn"
                      ]
                    }
                  ]
                }
              ]
            }
          }
        ],
        "Tags": [
          {
            "Key": "ManagedBy",
            "Value": "CloudFormation"
          },
          {
            "Key": "Purpose",
            "Value": "terraform-apply"
          }
        ]
      }
    },
    "StateBucketPolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "Condition": "CreateStateBucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Bucket": {
          "Ref": "StateBucket"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "DenyInsecureTransport",
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:*",
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "StateBucket",
                    "Arn"
                  ]
                },
                {
                  "Fn::Sub": "${StateBucket.Arn}/*"
                }
              ],
              "Condition": {
                "Bool": {
                  "aws:SecureTransport": "false"
                }
              }
            },
            {
              "Sid": "DenyUnencryptedObjectWrites",
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:PutObject",
              "Resource": {
                "Fn::Sub": "${StateBucket.Arn}/*"
              },
              "Condition": {
                "StringNotEquals": {
                  "s3:x-amz-server-side-encryption": "aws:kms"
                }
              }
            },
            {
              "Sid": "DenyWrongStateKmsKey",
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:PutObject",
              "Resource": {
                "Fn::Sub": "${StateBucket.Arn}/*"
              },
              "Condition": {
                "StringNotEquals": {
                  "s3:x-amz-server-side-encryption-aws-kms-key-id": {
                    "Fn::GetAtt": [
                      "StateKmsKey",
                      "Arn"
                    ]
                  }
                }
              }
            }
          ]
        }
      }
    },
    "PlanArtifactBucketPolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Bucket": {
          "Ref": "PlanArtifactBucket"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "DenyInsecureTransport",
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:*",
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "PlanArtifactBucket",
                    "Arn"
                  ]
                },
                {
                  "Fn::Sub": "${PlanArtifactBucket.Arn}/*"
                }
              ],
              "Condition": {
                "Bool": {
                  "aws:SecureTransport": "false"
                }
              }
            },
            {
              "Sid": "DenyUnencryptedArtifactWrites",
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:PutObject",
              "Resource": {
                "Fn::Sub": "${PlanArtifactBucket.Arn}/${GitHubRepository}/*"
              },
              "Condition": {
                "StringNotEquals": {
                  "s3:x-amz-server-side-encryption": "aws:kms"
                }
              }
            },
            {
              "Sid": "DenyWrongArtifactKmsKey",
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:PutObject",
              "Resource": {
                "Fn::Sub": "${PlanArtifactBucket.Arn}/${GitHubRepository}/*"
              },
              "Condition": {
                "StringNotEquals": {
                  "s3:x-amz-server-side-encryption-aws-kms-key-id": {
                    "Fn::GetAtt": [
                      "PlanArtifactKmsKey",
                      "Arn"
                    ]
                  }
                }
              }
            },
            {
              "Sid": "RequireCreateOnlyArtifactWrites",
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:PutObject",
              "Resource": {
                "Fn::Sub": "${PlanArtifactBucket.Arn}/${GitHubRepository}/*"
              },
              "Condition": {
                "Null": {
                  "s3:if-none-match": "true"
                }
              }
            },
            {
              "Fn::If": [
                "ConfigureCloudTrailDelivery",
                {
                  "Sid": "AllowCloudTrailAclCheck",
                  "Effect": "Allow",
                  "Principal": {
                    "Service": "cloudtrail.amazonaws.com"
                  },
                  "Action": "s3:GetBucketAcl",
                  "Resource": {
                    "Fn::GetAtt": [
                      "PlanArtifactBucket",
                      "Arn"
                    ]
                  },
                  "Condition": {
                    "StringEquals": {
                      "aws:SourceArn": {
                        "Ref": "CloudTrailTrailArn"
                      }
                    }
                  }
                },
                {
                  "Ref": "AWS::NoValue"
                }
              ]
            },
            {
              "Fn::If": [
                "ConfigureCloudTrailDelivery",
                {
                  "Sid": "AllowCloudTrailWriteWhenConfigured",
                  "Effect": "Allow",
                  "Principal": {
                    "Service": "cloudtrail.amazonaws.com"
                  },
                  "Action": "s3:PutObject",
                  "Resource": {
                    "Fn::Sub": "${PlanArtifactBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
                  },
                  "Condition": {
                    "StringEquals": {
                      "aws:SourceArn": {
                        "Ref": "CloudTrailTrailArn"
                      },
                      "s3:x-amz-acl": "bucket-owner-full-control"
                    }
                  }
                },
                {
                  "Ref": "AWS::NoValue"
                }
              ]
            }
          ]
        }
      }
    }
  },
  "Outputs": {
    "AwsAccountId": {
      "Value": {
        "Ref": "AWS::AccountId"
      }
    },
    "GithubOidcProviderArn": {
      "Value": {
        "Fn::If": [
          "CreateGithubOidcProvider",
          {
            "Fn::GetAtt": [
              "GithubOidcProvider",
              "Arn"
            ]
          },
          {
            "Ref": "ExistingGithubOidcProviderArn"
          }
        ]
      }
    },
    "TerraformPlanRoleArn": {
      "Value": {
        "Fn::GetAtt": [
          "TerraformPlanRole",
          "Arn"
        ]
      }
    },
    "TerraformApplyRoleArn": {
      "Value": {
        "Fn::GetAtt": [
          "TerraformApplyRole",
          "Arn"
        ]
      }
    },
    "KmsBreakGlassRoleArn": {
      "Value": {
        "Fn::GetAtt": [
          "KmsBreakGlassRole",
          "Arn"
        ]
      }
    },
    "GitHubEnvironment": {
      "Value": {
        "Ref": "GitHubEnvironment"
      }
    },
    "GitHubTeardownEnvironment": {
      "Value": {
        "Ref": "GitHubTeardownEnvironment"
      }
    },
    "StateBucketName": {
      "Value": {
        "Fn::If": [
          "CreateStateBucket",
          {
            "Ref": "StateBucket"
          },
          {
            "Ref": "ExistingStateBucketName"
          }
        ]
      }
    },
    "StateBucketArn": {
      "Value": {
        "Fn::If": [
          "CreateStateBucket",
          {
            "Fn::GetAtt": [
              "StateBucket",
              "Arn"
            ]
          },
          {
            "Fn::Sub": "arn:${AWS::Partition}:s3:::${ExistingStateBucketName}"
          }
        ]
      }
    },
    "StateKmsKeyArn": {
      "Value": {
        "Fn::If": [
          "CreateStateBucket",
          {
            "Fn::GetAtt": [
              "StateKmsKey",
              "Arn"
            ]
          },
          {
            "Ref": "ExistingStateKmsKeyArn"
          }
        ]
      }
    },
    "StateKey": {
      "Value": {
        "Ref": "StateKey"
      }
    },
    "PlanArtifactBucketName": {
      "Value": {
        "Ref": "PlanArtifactBucket"
      }
    },
    "PlanArtifactBucketArn": {
      "Value": {
        "Fn::GetAtt": [
          "PlanArtifactBucket",
          "Arn"
        ]
      }
    },
    "PlanArtifactKmsKeyArn": {
      "Value": {
        "Fn::GetAtt": [
          "PlanArtifactKmsKey",
          "Arn"
        ]
      }
    },
    "NodePermissionsBoundaryArn": {
      "Value": {
        "Ref": "NodePermissionsBoundary"
      }
    },
    "NodeSshKeyPairName": {
      "Value": {
        "Ref": "NodeSshKeyPair"
      }
    },
    "NodeSshKeyFingerprint": {
      "Value": {
        "Fn::GetAtt": [
          "NodeSshKeyPair",
          "KeyFingerprint"
        ]
      }
    }
  }
}
